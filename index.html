<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Janice Seelan Music Studio</title>
<meta name="description" content="Hum a tune, turn it into real instruments, layer it into a song.">
<meta name="theme-color" content="#16151D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Home: list of songs -->
<section id="home" class="screen">
  <header class="home-head">
    <div>
      <h1 class="brand">Janice Seelan <span>Music Studio</span></h1>
      <p class="sub">Hum a tune. Hear it on real instruments. Layer it into a song.</p>
    </div>
    <button class="icon-btn" id="homeSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
  </header>
  <div class="home-actions">
    <button class="btn primary big" id="newSong"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>New song</button>
    <label class="btn big" for="importSong"><svg viewBox="0 0 24 24"><use href="#i-open"/></svg>Open backup</label>
    <input type="file" id="importSong" accept=".humsong,application/json" hidden>
  </div>
  <h2 class="label">Your songs</h2>
  <ul id="songList" class="song-list"></ul>
  <p id="installHint" class="hint" hidden></p>
</section>

<!-- Studio -->
<section id="studio" class="screen" hidden>
  <header class="studio-head">
    <button class="icon-btn" id="back" aria-label="All songs"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <input id="songName" class="song-name" aria-label="Song name" autocomplete="off">
    <button class="icon-btn" id="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg></button>
    <button class="icon-btn" id="openHelper" aria-label="Tune helper"><svg viewBox="0 0 24 24"><use href="#i-wand"/></svg></button>
    <button class="icon-btn" id="openExport" aria-label="Export"><svg viewBox="0 0 24 24"><use href="#i-export"/></svg></button>
    <button class="icon-btn" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
  </header>
  <div class="ruler-wrap"><canvas id="ruler" aria-label="Song timeline. Tap to set where playback starts."></canvas></div>
  <div id="tracks" class="tracks"></div>
  <button class="add-layer" id="addLayer"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Add a layer</button>
</section>

<!-- Transport -->
<footer id="transport" class="transport" hidden>
  <button class="tp-play" id="play" aria-label="Play"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg></button>
  <button class="tp-rec" id="rec" aria-label="Record a hum"><span></span></button>
  <div class="tp-pos" id="pos">1.1</div>
  <button class="tp-song" id="songBtn" aria-label="Tempo and length"><b id="bpm">90</b> BPM<br><b id="bars">8</b> bars</button>
  <button class="icon-btn tog" id="loop" aria-label="Loop" aria-pressed="true"><svg viewBox="0 0 24 24"><use href="#i-loop"/></svg></button>
  <button class="icon-btn tog" id="metro" aria-label="Metronome" aria-pressed="false"><svg viewBox="0 0 24 24"><use href="#i-metro"/></svg></button>
</footer>

<!-- Bottom sheet (content filled by app.js) -->
<div id="sheetBack" class="sheet-back" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-grip"></div>
  <div id="sheetBody" class="sheet-body"></div>
</div>

<!-- Full-screen panels -->
<section id="panel" class="panel" hidden></section>

<div id="toast" class="toast" hidden></div>

<!-- Icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12.3-7.4a1 1 0 0 0 0-1.72L8.5 3.74A1 1 0 0 0 7 4.6z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></g></symbol>
    <symbol id="i-metro" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l4 18H5z"/><path d="M12 15l5-8"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-wand" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L16 8M14 4v2M18 8h2M17.5 4.5l-1.4 1.4M19 2l.6 1.4L21 4l-1.4.6L19 6l-.6-1.4L17 4l1.4-.6z"/></g></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g></symbol>
    <symbol id="i-drum" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="9" rx="8" ry="3"/><path d="M4 9v7c0 1.7 3.6 3 8 3s8-1.3 8-3V9"/></g></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></g></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h2M6 8v8M10 4v16M14 7v10M18 10v4M22 12h0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></g></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-drone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v14"/><circle cx="12" cy="18" r="4"/><path d="M8 6h8"/></g></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></g></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></g></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<script src="vendor/lame.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
